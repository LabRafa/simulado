<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doenças orais · Grupo 2</title>
<style>
html,body{margin:0;height:100%;background:#0d1b3e;overflow:hidden}
#caixa{position:fixed;inset:0;overflow:hidden;contain:strict}
#palco{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;border:0;background:#f6f8fc}
#vire{position:fixed;left:0;right:0;bottom:4vh;text-align:center;color:#fff;font:600 15px system-ui,sans-serif;opacity:.85;display:none}
@media (orientation:portrait) and (max-width:900px){#vire{display:block}}
</style></head><body>
<div id="caixa"><iframe id="palco" src="slides.html" allow="fullscreen" title="Apresentação"></iframe></div>
<div id="vire">📱↻ Vire o celular para ver maior</div>
<script>
const f=document.getElementById('palco');
function ajusta(){const c=document.getElementById('caixa'),s=Math.min(c.clientWidth/1600,c.clientHeight/900);f.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',ajusta);ajusta();
if(location.hash)f.src='slides.html'+location.hash;
f.addEventListener('load',()=>{try{f.contentWindow.focus()}catch(e){}});
addEventListener('keydown',e=>{try{f.contentWindow.focus();f.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key:e.key,code:e.code,bubbles:true}))}catch(x){}});
</script></body></html>
